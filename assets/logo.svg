<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MPage</title>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd6cf"/>
      <stop offset="1" stop-color="#0b7f86"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff0e6"/>
      <stop offset="1" stop-color="#0fa3a8"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fdfc"/>
      <stop offset="0.45" stop-color="#b4e6e8"/>
      <stop offset="1" stop-color="#5aaab3"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe9ec"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7fff8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2ee6dc" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6dc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2ee6dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#032a33" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- artwork is drawn around (254, 275); center it and fill the canvas -->
  <g transform="translate(256 256) scale(1.2) translate(-254 -276)">
  <!-- glow under the stack -->
  <ellipse cx="262" cy="438" rx="150" ry="20" fill="url(#glow)"/>

  <!-- back card -->
  <g transform="translate(104 156) skewY(-14)" filter="url(#shadow)">
    <rect width="186" height="252" rx="18" fill="url(#back)"/>
    <rect width="186" height="252" rx="18" fill="none" stroke="url(#edge)" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- middle card -->
  <g transform="translate(150 186) skewY(-14)" filter="url(#shadow)">
    <rect width="186" height="258" rx="18" fill="url(#mid)"/>
    <rect width="186" height="258" rx="18" fill="none" stroke="url(#edge)" stroke-width="3"/>
  </g>

  <!-- front document -->
  <g filter="url(#shadow)">
    <path d="M216 168H350L404 222V382A20 20 0 0 1 384 402H216A20 20 0 0 1 196 382V188A20 20 0 0 1 216 168Z" fill="url(#doc)"/>
    <path d="M216 168H350L404 222V382A20 20 0 0 1 384 402H216A20 20 0 0 1 196 382V188A20 20 0 0 1 216 168Z" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5"/>
    <!-- folded corner -->
    <path d="M350 168V208A14 14 0 0 0 364 222H404Z" fill="url(#fold)"/>
    <path d="M350 168V208A14 14 0 0 0 364 222H404" fill="none" stroke="#8fc9cf" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- text lines -->
    <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.92">
      <path d="M232 270H366"/>
      <path d="M232 308H366"/>
      <path d="M232 346H366"/>
    </g>
  </g>
  </g>
</svg>
